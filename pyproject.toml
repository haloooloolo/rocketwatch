[project]
name = "rocketwatch"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.4",
    "anthropic>=1.11.0,<1.12.0",
    "google-genai>=2.26.0,<2.27.0",
    "openai>=3.22.1,<3.23.0",
    "aiocache==0.12.3",
    "anyascii==0.3.3",
    "beautifulsoup4==4.15.0",
    "bidict==0.24.1",
    "cachetools==7.2.1",
    "colorama==0.4.6",
    "cronitor==4.9.0",
    "discord.py[voice]==2.7.1",
    "discord-ext-voice-recv>=0.5.0",
    "eth-typing==6.0.0",
    "eth-utils==6.0.0",
    "hexbytes==2.0.0",
    "humanize==4.16.0",
    "lameenc>=1.8.2",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "psutil==7.2.2",
    "pydantic>=2.0.0,<3.0.0",
    "pymongo==4.18.2",
    # 18 rejects the list that web3's ENS normalizer passes to NFC
    "pyunormalize<18",
    "pytz==2026.4",
    "regex==2026.9.29",
    "retry-async==0.1.4",
    "soundfile>=0.13.1",
    "tabulate==0.10.0",
    "termplotlib==0.3.9",
    "uptime==3.0.1",
    "web3>=8.0.0,<8.1.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=rocketwatch --cov=sentinel --cov-fail-under=80"
markers = [
    "integration_db: requires a Mongo instance (testcontainers)",
    "integration_chain: requires a forked anvil node",
    "integration_beacon: requires recorded beacon API responses",
]
filterwarnings = [
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:The wait_for_logs function with string or callable predicates is deprecated:DeprecationWarning",
    "ignore:'count' is passed as positional argument:DeprecationWarning",
    "ignore:'return' in a 'finally' block:SyntaxWarning",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["rocketwatch", "sentinel"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E501", "E203", "E231"]

[tool.ruff.lint.isort]
known-first-party = ["rocketwatch", "sentinel"]

[tool.pyrefly]
project-includes = ["rocketwatch"]
python-version = "3.13.0"
preset = "legacy"
ignore-missing-imports = [
    "aiocache",
    "aiocache.*",
    "ens",
    "ens.*",
    "retry_async",
    "retry_async.*",
    "termplotlib",
    "termplotlib.*",
    "cronitor",
    "cronitor.*",
    "uptime",
    "uptime.*",
    "lameenc",
    "lameenc.*",
    "soundfile",
    "soundfile.*",
    "testcontainers",
    "testcontainers.*",
]
check-unannotated-defs = true
infer-return-types = "never"

[tool.pyrefly.errors]
no-any-return = "error"
redundant-cast = "warn"
unannotated-return = "error"
implicit-any = "error"
implicit-any-parameter = "error"
# lambda parameters cannot be annotated
implicit-any-lambda = "ignore"

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "testcontainers[mongodb]>=4.0.0",
]
dev = [
    "pre-commit>=4.5.1",
    "pyrefly>=1.3.2",
    "ruff>=0.15.9",
    "types-cachetools>=6.2.0.20260317",
    "types-colorama>=0.4.15.20250801",
    "types-psutil>=7.2.2.20260402",
    "types-pytz>=2026.1.1.20260304",
    "types-regex>=2026.3.32.20260329",
    "types-tabulate>=0.10.0.20260308",
]
