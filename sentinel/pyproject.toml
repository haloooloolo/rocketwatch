[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.4",
    "discord.py==2.7.1",
    "pydantic>=2.0.0,<3.0.0",
]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pyrefly]
python-version = "3.12.0"
preset = "legacy"
check-unannotated-defs = true
infer-return-types = "never"

[tool.pyrefly.errors]
no-any-return = "error"
redundant-cast = "warn"
unannotated-return = "error"
implicit-any = "error"
implicit-any-parameter = "error"
# lambda parameters cannot be annotated
implicit-any-lambda = "ignore"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
]
