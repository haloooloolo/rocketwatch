repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock (rocketwatch)
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: uv-lock-check-sentinel
        name: uv lock (sentinel)
        entry: uv lock --check --project sentinel
        language: system
        pass_filenames: false
        files: ^sentinel/(pyproject\.toml|uv\.lock)$
      - id: pytest
        name: pytest
        entry: uv run --group test pytest -x -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pyrefly
        name: pyrefly (rocketwatch)
        entry: uv run --group test pyrefly check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pyrefly-sentinel
        name: pyrefly (sentinel)
        entry: uv run --project sentinel --group dev pyrefly check --config sentinel/pyproject.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
