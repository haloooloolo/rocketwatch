services:
  rocketwatch:
    volumes:
      - ./memray-output:/tmp/memray
    command:
      - bash
      - -c
      - |
        pip install --quiet --no-cache-dir --target /opt/memray memray &&
        PYTHONPATH=/app:/opt/memray exec python -m memray run \
          --aggregate --trace-python-allocators \
          -o /tmp/memray/rocketwatch-$$(date +%Y%m%d-%H%M%S).bin __main__.py
    # memray writes the aggregated capture on exit; SIGINT lets the bot shut
    # down cleanly so the file is complete
    stop_signal: SIGINT
    stop_grace_period: 2m
